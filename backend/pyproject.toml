[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cybersentinel-backend"
version = "0.1.0"
description = "CyberSentinel API"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",  # CVE-2026-84379, CVE-2026-84380, CVE-2026-84382
    "mypy>=1.13,<2",
    "pytest>=9.0.3,<10",  # CVE-2025-71176
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cybersentinel_backend"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
files = ["src"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
